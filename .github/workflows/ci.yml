name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      # No `vision` extra: the counting core and its tests must not need torch or onnxruntime.
      - name: Install dependencies
        run: uv sync --all-groups

      - name: Heavy packages absent from the fast job
        run: uv run python -c "import importlib.util as u, sys; sys.exit(any(u.find_spec(m) for m in ('torch', 'onnxruntime', 'rfdetr')))"

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest -m "not integration" --cov=src --cov-report=term-missing
